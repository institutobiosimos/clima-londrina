name: Sondar fontes (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          curl -s -m 60 https://ivs.ipea.gov.br/js/app.9c86c648.js > a.js
          echo "== DEFS"; grep -o '\(const\|let\|,\)\s*\(xr\|Ar\|Go\|Hi\|Jo\)\s*=\s*[^,;]*' a.js | head
          echo "== GETS"; grep -o 'get(`\${[A-Za-z]*}[^`]*`' a.js | sort -u | head -60
          echo "== MAPA"; grep -o '.\{60\}\(geojson\|topojson\|shape\|mapa_\|getMapa\|geometria\)[^,]\{0,100\}' a.js | head -12
          echo "== TRY"; B=https://ivs.ipea.gov.br/api/; for p in "udhbymunicipio?ibge=4113700&page=1&filter=" "ivs/udhbymunicipio?ibge=4113700&page=1&filter="; do echo "-- $p"; curl -s -m 60 "$B$p" | head -c 600; echo; done
