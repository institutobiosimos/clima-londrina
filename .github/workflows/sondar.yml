name: Sondar fontes (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          curl -s -m 60 https://ivs.ipea.gov.br/js/app.9c86c648.js > a.js
          echo "== DEFS2"; grep -o '\(Cr\|Or\|zo\|Fi\)\s*=\s*[^,;]\{0,80\}' a.js | head; grep -o 'findByCollection("[^"]*")' a.js | sort -u
          T=c2b216ed24add91817de9eec008bc5
          for c in base_dados_shapes base_dados; do echo "== COL $c"; curl -s -m 60 "https://ivs.ipea.gov.br/api/cockpit/api/collections/get/$c?token=$T" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for e in d.get('entries',[]):
              print({k:(str(v)[:160]) for k,v in e.items() if not k.startswith('_')})
          " 2>&1 | head -40; done
