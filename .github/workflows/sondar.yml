name: Sondar fontes (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          echo "== ATLASD"; curl -s -m 60 -L https://atlasdigital.mdr.gov.br/paginas/downloads.xhtml | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 2500; echo
          curl -s -m 60 -L https://atlasdigital.mdr.gov.br/paginas/downloads.xhtml | grep -o '\(href\|onclick\|src\)="[^"]*"' | grep -v javax | sort -u | head -40
          echo "== IVSJS"; curl -s -m 60 https://ivs.ipea.gov.br/js/app.9c86c648.js > a.js
          grep -o '.\{120\}udhbymunicipio.\{160\}' a.js | head -3; echo
          grep -o '.\{100\}ivs.ipea.gov.br/api.\{100\}' a.js | head -3; echo
          grep -o 'get("[^"]*"\|get(`[^`]*`\|"[a-z_]*by[a-z_]*/' a.js | sort -u | head -40
          grep -o '.\{80\}geojson.\{80\}\|.\{60\}shape.\{80\}' a.js | head -5
