name: Sondar fontes (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          pip install -q openpyxl pandas >/dev/null 2>&1
          F=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios
          echo "== MALHA"; curl -s -m 60 $F/malha_com_atributos/ | grep -o 'href="[^"]*"' | sed -n '6,20p'
          curl -s -m 60 $F/malha_com_atributos/setores/ | grep -o 'href="[^"]*"' | sed -n '6,20p'
          echo "== DIC"; curl -s -m 120 -o dic.xlsx $F/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx
          python3 - <<'PY'
          import pandas as pd
          x = pd.read_excel('dic.xlsx', sheet_name=None, header=None)
          for n, df in x.items():
              print('### SHEET', n, df.shape)
              s = df.astype(str).agg(' | '.join, axis=1)
              for l in s[s.str.contains('V010|V0001|V0002|V0003|V0005|V0006|60 a|0 a 4|moradores|Rede geral|esgot|rendimento|Total de pessoas', case=False, regex=True)].head(40): print('  ', l[:230])
          PY
          echo "== BAIRRO"; curl -s -m 60 $F/Agregados_por_Bairro_csv/ | grep -o 'href="[^"]*"' | sed -n '6,25p'
