name: Diagnóstico qualidade do ar (IAT)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  ar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data/_diag && python3 tools/ar_diag.py > data/_diag/ar.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_diag; git commit -q -m "diag ar" || true; git pull -q --rebase origin main || true; git push
